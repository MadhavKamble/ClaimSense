# Central configuration — every tunable value in the system lives here,
# not hardcoded inside individual modules. This means changing a threshold
# or swapping a model doesn't require touching business logic code.

llm:
  model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  classification_temperature: 0
  summarization_temperature: 0.3

rag:
  chunk_size_words: 400
  chunk_overlap_words: 50
  top_k_retrieval: 3

routing:
  confidence_floor: 0.6
  escalation_thresholds:
    Auto: 8000
    Home: 15000
    Health: 10000
    Travel: 2000
    Renters: 5000

paths:
  claims_csv: data/claims.csv
  policy_docs_dir: data/policy_docs
  db_path: claims.db
  chroma_store: chroma_store
  logs_dir: logs

data_generation:
  num_synthetic_claims: 80
  random_seed: 42
